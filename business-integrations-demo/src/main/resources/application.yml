server:
  port: 18081

integration:
  sso-base-url: http://localhost:18081
  sso-app-secret: demo-sso-secret
  sso-code-ttl-seconds: 60
  sf-check-word: demo-sf-check-word
  sf-customer-code: DEMO_CUSTOMER

demo:
  storage: memory
  sso-state: memory

rag:
  embedding:
    provider: hash
    base-url: https://api.openai.com/v1
    api-key:
    model: text-embedding-3-small
    timeout-seconds: 30
  llm:
    enabled: false
    base-url: https://api.openai.com/v1
    api-key:
    model: gpt-4o-mini
    timeout-seconds: 30
