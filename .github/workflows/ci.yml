name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agent_gateway
          MYSQL_USER: agent_gateway
          MYSQL_PASSWORD: agent_gateway_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uagent_gateway -pagent_gateway_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      AGENT_DB_USERNAME: agent_gateway
      AGENT_DB_PASSWORD: agent_gateway_test
      RUN_MYSQL_IT: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build API and run tests
        run: mvn -B -f api/pom.xml verify

      - name: Check UI server syntax
        run: node --check ui/server.mjs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports/
          if-no-files-found: ignore
