<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Team Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #63708a;
      --line: #dfe5ef;
      --primary: #2856d8;
      --primary-soft: #e9efff;
      --success: #137a4b;
      --success-soft: #e5f6ee;
      --danger: #b62e3d;
      --danger-soft: #fdecef;
      --shadow: 0 16px 40px rgba(36, 54, 92, .09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 0%, #e8efff 0, transparent 32rem),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); letter-spacing: -.04em; }
    header p { margin: 10px 0 0; color: var(--muted); max-width: 680px; line-height: 1.7; }
    .status { padding: 8px 12px; border-radius: 999px; background: var(--success-soft); color: var(--success); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 20px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
    .panel h2 { margin: 0 0 6px; font-size: 20px; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .agents { display: grid; gap: 12px; margin-top: 18px; }
    .agent { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fbfcff; }
    .agent strong { display: block; margin-bottom: 6px; }
    code { background: var(--primary-soft); color: #2449b6; border-radius: 6px; padding: 2px 6px; font-size: 12px; }
    textarea, select, button { font: inherit; }
    textarea { width: 100%; min-height: 118px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 13px; color: var(--ink); outline: none; }
    textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(40, 86, 216, .12); }
    .controls { display: flex; gap: 10px; margin-top: 12px; }
    select { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: white; color: var(--ink); }
    button { border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; font-weight: 700; background: var(--primary); color: white; }
    button.secondary { background: var(--primary-soft); color: var(--primary); }
    button:disabled { opacity: .55; cursor: wait; }
    .result { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .route { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tag { padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }
    .tag.ok { background: var(--success-soft); color: var(--success); }
    .tag.bad { background: var(--danger-soft); color: var(--danger); }
    .answer { font-size: 16px; line-height: 1.65; margin: 10px 0; }
    pre { margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; background: #101827; color: #dbe6ff; border-radius: 12px; padding: 14px; max-height: 320px; overflow: auto; font: 12px/1.6 Consolas, monospace; }
    .evaluation { margin-top: 20px; }
    .eval-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .score { font-size: 30px; font-weight: 800; letter-spacing: -.04em; }
    .eval-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .metric { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .metric b { display: block; font-size: 22px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; }
    .empty { color: var(--muted); padding: 24px 0; }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      header { align-items: start; flex-direction: column; }
      .eval-grid { grid-template-columns: 1fr; }
      .controls { flex-direction: column; }
      button, select { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Agent Team Console</h1>
        <p>主管负责路由，专家只能使用自己的 Java 工具白名单。这里可以查看每次 handoff、实际规划器、工具结果和路由评测。</p>
      </div>
      <div class="status" id="status">正在连接服务</div>
    </header>

    <section class="grid">
      <div class="panel">
        <h2>专家 Agent</h2>
        <div class="hint">工具白名单由后端强制校验，模型不能越权调用。</div>
        <div class="agents" id="agents"><div class="empty">正在加载...</div></div>
      </div>

      <div class="panel">
        <h2>发起团队任务</h2>
        <div class="hint">不指定 Agent 时由主管自动路由；也可以直接选择专家验证权限边界。</div>
        <div style="margin-top:16px">
          <textarea id="query" aria-label="任务内容">A002 还有多少库存</textarea>
          <div class="controls">
            <select id="agentCode" aria-label="选择 Agent">
              <option value="">自动路由</option>
              <option value="inventory-specialist">库存专家</option>
              <option value="purchase-specialist">采购专家</option>
            </select>
            <button id="send">发送任务</button>
          </div>
        </div>
        <div class="result" id="result">
          <div class="empty">提交任务后显示主管路由和专家执行结果。</div>
        </div>
      </div>
    </section>

    <section class="panel evaluation">
      <div class="eval-head">
        <div>
          <h2>路由评测</h2>
          <div class="hint">固定覆盖库存、采购、主管兜底和工具越权拦截。</div>
        </div>
        <button class="secondary" id="evaluate">运行评测</button>
      </div>
      <div id="evaluation"><div class="empty">点击“运行评测”查看通过率。</div></div>
    </section>
  </main>

  <script>
    const state = { agents: [] };
    const statusEl = document.querySelector('#status');
    const agentsEl = document.querySelector('#agents');
    const resultEl = document.querySelector('#result');
    const evaluationEl = document.querySelector('#evaluation');
    const sendButton = document.querySelector('#send');
    const evaluateButton = document.querySelector('#evaluate');

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined && text !== null) node.textContent = String(text);
      if (className) node.className = className;
      return node;
    }

    async function request(path, options) {
      const response = await fetch(path, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.message || `HTTP ${response.status}`);
      return body;
    }

    function renderAgents() {
      agentsEl.replaceChildren();
      for (const agent of state.agents) {
        const card = element('article', null, 'agent');
        card.append(element('strong', agent.displayName));
        card.append(element('div', agent.description, 'hint'));
        const tools = element('div');
        tools.style.marginTop = '8px';
        for (const tool of agent.allowedTools) {
          const code = element('code', tool);
          code.style.marginRight = '6px';
          tools.append(code);
        }
        card.append(tools);
        agentsEl.append(card);
      }
    }

    function renderTeamResponse(data) {
      resultEl.replaceChildren();
      const route = element('div', null, 'route');
      route.append(element('span', `Agent: ${data.selectedAgent}`, 'tag'));
      route.append(element('span', `Planner: ${data.result.planner}`, data.result.fallback ? 'tag bad' : 'tag ok'));
      if (data.result.fallback) route.append(element('span', '已自动降级', 'tag bad'));
      resultEl.append(route);
      resultEl.append(element('div', data.supervisorReason, 'hint'));
      resultEl.append(element('div', data.result.answer, 'answer'));
      resultEl.append(element('pre', JSON.stringify({
        handoffs: data.handoffs,
        toolCalls: data.result.toolCalls,
        draftId: data.result.draftId,
        contextId: data.result.contextId
      }, null, 2)));
    }

    async function sendTask() {
      sendButton.disabled = true;
      statusEl.textContent = '处理中';
      resultEl.replaceChildren(element('div', '主管正在路由并调用专家...', 'empty'));
      try {
        const data = await request('/api/agent/team/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: 'browser-demo',
            query: document.querySelector('#query').value,
            agentCode: document.querySelector('#agentCode').value || null
          })
        });
        renderTeamResponse(data);
        statusEl.textContent = '服务正常';
      } catch (error) {
        resultEl.replaceChildren(element('div', `请求失败：${error.message}`, 'tag bad'));
        statusEl.textContent = '请求失败';
      } finally {
        sendButton.disabled = false;
      }
    }

    function renderEvaluation(data) {
      evaluationEl.replaceChildren();
      const head = element('div', null, 'eval-head');
      head.append(element('div', `路由评测通过 ${data.hits}/${data.total}`, 'hint'));
      head.append(element('div', `${Math.round(data.passRate * 100)}%`, 'score'));
      evaluationEl.append(head);

      const metrics = element('div', null, 'eval-grid');
      const items = [
        ['用例总数', data.total],
        ['通过数量', data.hits],
        ['通过率', `${Math.round(data.passRate * 100)}%`]
      ];
      for (const [label, value] of items) {
        const metric = element('div', null, 'metric');
        metric.append(element('span', label, 'hint'));
        metric.append(element('b', value));
        metrics.append(metric);
      }
      evaluationEl.append(metrics);

      const table = element('table');
      const headRow = element('tr');
      ['用例', '期望 Agent', '实际 Agent', 'Planner', '结果'].forEach(label => headRow.append(element('th', label)));
      table.append(headRow);
      for (const item of data.cases) {
        const row = element('tr');
        row.append(element('td', item.name));
        row.append(element('td', item.expectedAgent));
        row.append(element('td', item.actualAgent || '—'));
        row.append(element('td', item.actualPlanner || '—'));
        row.append(element('td', item.passed ? '通过' : '失败', item.passed ? 'tag ok' : 'tag bad'));
        table.append(row);
      }
      evaluationEl.append(table);
    }

    async function runEvaluation() {
      evaluateButton.disabled = true;
      evaluationEl.replaceChildren(element('div', '正在运行路由评测...', 'empty'));
      try {
        renderEvaluation(await request('/api/agent/team/evaluate'));
      } catch (error) {
        evaluationEl.replaceChildren(element('div', `评测失败：${error.message}`, 'tag bad'));
      } finally {
        evaluateButton.disabled = false;
      }
    }

    document.querySelector('#send').addEventListener('click', sendTask);
    evaluateButton.addEventListener('click', runEvaluation);

    request('/api/agent/team/agents')
      .then(agents => {
        state.agents = agents;
        renderAgents();
        statusEl.textContent = '服务正常';
      })
      .catch(error => {
        agentsEl.replaceChildren(element('div', `加载失败：${error.message}`, 'tag bad'));
        statusEl.textContent = '连接失败';
      });
  </script>
</body>
</html>
