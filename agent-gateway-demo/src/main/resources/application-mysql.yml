spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/agent_gateway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${AGENT_DB_USERNAME:agent_gateway}
    password: ${AGENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-mysql.sql

agent:
  storage: mysql
  context-store: mysql
